# Game 分片集群：StatefulSet 保证稳定的有序 pod 名（game-shard-0..N-1）。
# 每个 pod 通过 POD_NAME 末尾序号自动得到 shard_id（见 pkg/config 环境覆盖）。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: game-shard
  namespace: newgame
spec:
  serviceName: game-shard
  replicas: 50                      # 固定逻辑分片；不得交给普通 HPA 改变
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: game-shard
  template:
    metadata:
      labels:
        app: game-shard
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: game
          image: newgame/game:0.2.0
          args: ["-config", "/etc/newgame/game.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: http, containerPort: 9100 }
            - { name: grpc, containerPort: 9150 }
          env:
            - name: POD_NAME              # game-shard-3 → shard_id=3
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NG_ENVIRONMENT
              value: "production"
            - name: NG_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: newgame-secrets
                  key: internal-secret
            - name: NG_SHARD_COUNT
              value: "50"
            - name: NG_HTTP_ADDR
              value: ":9100"
            - name: NG_GRPC_ADDR
              value: ":9150"
            - name: NG_ZONE_ID
              value: "1"
            - name: NG_REDIS_CLUSTER
              value: "redis-0.redis:6379,redis-1.redis:6379,redis-2.redis:6379"
            - name: NG_NATS
              value: "nats://nats:4222"
            - name: NG_POSTGRES_SHARDS
              valueFrom:
                secretKeyRef:
                  name: newgame-secrets
                  key: postgres-shards
          volumeMounts:
            - name: cfg
              mountPath: /etc/newgame
              readOnly: true
            - name: internal-tls
              mountPath: /etc/newgame/tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi" }
      volumes:
        - name: cfg
          configMap:
            name: game-config
        - name: internal-tls
          secret:
            secretName: newgame-internal-tls
---
apiVersion: v1
kind: Service
metadata:
  name: game-shard
  namespace: newgame
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app: game-shard
  ports:
    - { name: http, port: 9100, targetPort: http }
    - { name: grpc, port: 9150, targetPort: grpc }
