# Gate 接入层：无序 pod，水平扩展。客户端经 LoadBalancer（L4，连接粘滞）接入。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
  namespace: bastion
spec:
  replicas: 10                       # 10 万 CCU（~1.5 万连接/节点）；100 万时 67~100
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 2 }
  selector:
    matchLabels:
      app: gate
  template:
    metadata:
      labels:
        app: gate
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gate
          image: bastion/gate:0.2.0
          args: ["-config", "/etc/bastion/gate.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - { name: tcp,  containerPort: 9000 }
            - { name: http, containerPort: 9001 }
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NG_ENVIRONMENT
              value: "production"
            - name: NG_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: bastion-secrets
                  key: internal-secret
            - name: NG_SHARD_COUNT
              value: "50"
            - name: NG_TCP_ADDR
              value: ":9000"
            - name: NG_HTTP_ADDR
              value: ":9001"
            # 客户端可见地址：与 LoadBalancer 域名/高防 IP 一致，写入 Login 的 gate_addr
            - name: NG_ADVERTISE_TCP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: bastion-public-addresses
                  key: gate_tcp
            - name: NG_ZONE_ID
              value: "1"
            - name: NG_REDIS_CLUSTER
              value: "redis-0.redis:6379,redis-1.redis:6379,redis-2.redis:6379"
            - name: NG_NATS
              value: "nats://nats:4222"
          volumeMounts:
            - name: cfg
              mountPath: /etc/bastion
              readOnly: true
            - name: internal-tls
              mountPath: /etc/bastion/tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: "256Mi" }
            limits:   { cpu: "2",    memory: "1Gi" }
      volumes:
        - name: cfg
          configMap:
            name: gate-config
        - name: internal-tls
          secret:
            secretName: bastion-internal-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gate-lb
  namespace: bastion
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local       # 保留客户端 IP，利于连接粘滞
  selector:
    app: gate
  ports:
    - name: tcp
      port: 9000
      targetPort: tcp
