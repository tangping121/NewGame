# Game 采用固定逻辑分片，禁止普通 HPA 修改 StatefulSet 副本数。
# Gate 是无状态接入层，可以安全水平扩缩。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gate-hpa
  namespace: bastion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gate
  minReplicas: 10
  maxReplicas: 100
  metrics:
    - type: Pods
      pods:
        metric:
          name: ng_gate_connections
        target:
          type: AverageValue
          averageValue: "12000"       # 单节点超 1.2 万连接触发扩容（上限 1.5 万）
