# Copy to secret.yaml, replace every value, and apply it separately.
# secret.yaml is excluded by .gitignore/.dockerignore and must not be committed.
apiVersion: v1
kind: Secret
metadata:
  name: bastion-secrets
  namespace: bastion
type: Opaque
stringData:
  internal-secret: "replace-with-at-least-32-random-bytes"
  postgres-central: "postgres://user:password@pg0:5432/bastion?sslmode=require"
  postgres-shards: "postgres://user:password@pg0:5432/bastion?sslmode=require,postgres://user:password@pg1:5432/bastion?sslmode=require"
---
# Prefer cert-manager or an external secret controller in production. The
# server certificate must contain game-shard.bastion.svc as a DNS SAN and the
# certificate must allow both serverAuth and clientAuth.
apiVersion: v1
kind: Secret
metadata:
  name: bastion-internal-tls
  namespace: bastion
type: Opaque
stringData:
  ca.crt: "replace-with-internal-ca-pem"
  tls.crt: "replace-with-service-certificate-pem"
  tls.key: "replace-with-private-key-pem"
