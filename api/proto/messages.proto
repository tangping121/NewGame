syntax = "proto3";

package bastion.api;

option go_package = "bastion/api/pb";

message LoginRequest {
  string username = 1 [json_name = "username"];
  string password = 2 [json_name = "password"];
  int32 zone_id = 3 [json_name = "zone_id"];
}

message LoginResponse {
  int32 code = 1 [json_name = "code"];
  string token = 2 [json_name = "token"];
  int64 role_id = 3 [json_name = "role_id"];
  string gate_addr = 4 [json_name = "gate_addr"];
  string message = 5 [json_name = "message"];
}

message EnterGateRequest {
  string token = 1 [json_name = "token"];
}

message MatchRequest {
  int64 role_id = 1 [json_name = "role_id"];
  int32 mode = 2 [json_name = "mode"];
  int32 zone_id = 3 [json_name = "zone_id"];
}

message MatchResponse {
  int32 code = 1 [json_name = "code"];
  string match_id = 2 [json_name = "match_id"];
  string room_id = 3 [json_name = "room_id"];
}

message BattleRoomCreateRequest {
  repeated int64 members = 1 [json_name = "members"];
}

message BattleRoomCreateResponse {
  int32 code = 1 [json_name = "code"];
  string room_id = 2 [json_name = "room_id"];
}

message BattleResultRequest {
  string room_id = 1 [json_name = "room_id"];
  int64 role_id = 2 [json_name = "role_id"];
  bool win = 3 [json_name = "win"];
  int32 score = 4 [json_name = "score"];
}

message BattleResultResponse {
  int32 code = 1 [json_name = "code"];
}

message RankUpdateRequest {
  int32 zone_id = 1 [json_name = "zone_id"];
  int64 role_id = 2 [json_name = "role_id"];
  int64 score = 3 [json_name = "score"];
  string board = 4 [json_name = "board"];
}

message MailSendRequest {
  int64 role_id = 1 [json_name = "role_id"];
  string title = 2 [json_name = "title"];
  string content = 3 [json_name = "content"];
  string items = 4 [json_name = "items"];
}

message PayNotifyRequest {
  string order_id = 1 [json_name = "order_id"];
  int64 role_id = 2 [json_name = "role_id"];
  string product_id = 3 [json_name = "product_id"];
  int32 amount = 4 [json_name = "amount"];
  int32 status = 5 [json_name = "status"];
}

// Gate-to-Game forwarding uses generated protobuf messages and the default
// gRPC protobuf codec. Identity is authenticated by the internal interceptor.
message GameForwardRequest {
  int64 role_id = 1 [json_name = "role_id"];
  int32 zone_id = 2 [json_name = "zone_id"];
  uint32 cmd = 3 [json_name = "cmd"];
  uint32 act = 4 [json_name = "act"];
  bytes body = 5 [json_name = "body"];
}

message GameForwardResponse {
  bytes body = 1 [json_name = "body"];
}

service GameForwarder {
  rpc Forward(GameForwardRequest) returns (GameForwardResponse);
}
