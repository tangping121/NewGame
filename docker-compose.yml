services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newgame
      POSTGRES_PASSWORD: newgame
      POSTGRES_DB: newgame
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newgame -d newgame"]
      interval: 3s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      NG_POSTGRES: "postgres://newgame:newgame@postgres:5432/newgame?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  redis_data:
  pg_data:
  nats_data:
